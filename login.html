<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
  <body>
    <main class="login-container">
      <div class="logo">
        <img src="./assets/img/logo2.jpg" alt="Logo" />
      </div>
      <h1>Login</h1>
      <p>Welcome back! Please enter your details to continue.</p>
      <form action="./dashboard.html">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="login-button">Login</button>
      </form>
      <div class="divider">or</div>
      <div class="social-login">
        <button class="social google-login">Login with Google</button>
        <button class="social facebook-login">Login with Facebook</button>
      </div>
    </main>
  </body>
</html>
